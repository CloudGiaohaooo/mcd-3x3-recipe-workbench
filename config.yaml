# 麦门 3×3 配方工作台 —— 配置
# 生成器：默认规则版（离线可复现）；DeepSeek 可替换（OpenAI 兼容接口）。
# 麦当劳 MCP（Phase 1 接入）：https://mcp.mcd.cn  （Streamable HTTP + Bearer Token）
model:
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  response_format: json_object

fallback:
  provider: rule
  model: rule-based

# 麦当劳 MCP（已接入：recipe/mcp_client.py + recipe/live.py，--live 时拉真实数据）
mcd_mcp:
  base_url: https://mcp.mcd.cn
  token_env: MCD_MCP_TOKEN

# 流水线参数（对应《算法部分》的回退上限、停止条件）
generation:
  max_candidates: 20
  max_retries: 5
  max_pool: 3
  time_limit: 30

# 位置语义消融模式：full | no_position | shuffled | roles_only
position:
  mode: full
